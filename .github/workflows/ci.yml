name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install base package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Smoke-test base package
        run: |
          python -I -c "import holspec; print(f'holspec {holspec.__version__}')"
          holspec --help

      - name: Install test dependencies
        run: python -m pip install -e ".[dev,viz]"

      - name: Check lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Install wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Smoke-test installed package
        run: |
          python -I -c "import holspec; print(f'holspec {holspec.__version__}')"
          holspec --help
