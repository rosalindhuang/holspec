name: holspec
channels:
  - conda-forge
dependencies:
  - python=3.12.*
  - pip

  # Core package dependencies
  - numpy
  - scipy
  - pandas
  - gudhi
  - h5py
  - natsort
  - nbformat
  - pyyaml

  # Visualization and demos
  - matplotlib
  - pillow
  - seaborn

  # Jupyter
  - jupyterlab
  - ipykernel
  - ipywidgets
  - ipympl

  # Data ingestion and downstream analysis
  - pyarrow
  - openpyxl
  - pytables
  - scikit-learn

  # CLI and workflow utilities
  - rich
  - tqdm
  - typer

  # Development tools
  - pytest
  - ruff
  - pre-commit

  # Pip packages, if needed
  - pip: []
