name: holspec
channels:
  - conda-forge
dependencies:
  - python=3.12.*
  - pip

  # Core package dependencies
  - gudhi
  - h5py
  - natsort
  - numpy
  - pandas
  - pyyaml
  - scipy
  - typer

  # Visualization and examples
  - matplotlib
  - pillow

  # Notebook workflows
  - ipykernel
  - ipympl
  - ipywidgets
  - jupyterlab
  - nbformat

  # Development tools
  - pytest
  - ruff
